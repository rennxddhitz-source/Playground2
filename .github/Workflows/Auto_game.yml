name: AI Game Generator

on:
  issues:
    types: [labeled] # Robot aktif HANYA jika ada label baru di Issue

permissions:
  contents: write # Izin untuk menyimpan file index.html
  issues: write   # Izin untuk membalas komentar di Issue

jobs:
  build-game:
    # Hanya jalan jika labelnya bernama 'build-game'
    if: github.event.label.name == 'build-game'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Jalankan AI Coder
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python generate.py

      - name: Commit dan Push Game ke Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🎮 Auto-generate game from Issue #${{ github.event.issue.number }}"
          git push

      - name: Balas Komentar di Issue
        uses: peter-evans/commit-comment@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ✅ Game berhasil dibuat!
            Silakan lihat previewnya di: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
